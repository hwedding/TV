name: Build FongMi TV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 修改源码
      - name: Inject Custom Config URL
        run: |
          sed -i 's#return Config.get().getVodUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java
          sed -i 's#return Config.get().getLiveUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/config/LiveConfig.java
          sed -i '/chaquopy {/a \    pythonVersion "3.10"' TV/app/build.gradle

      # 安装Python 3.10
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 编译
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      # 重命名APK为简单英文名
      - name: Rename APK
        run: |
          # 查找并复制APK，使用简单英文名
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到APK: $apk"
            cp "$apk" "./fongmitv_hwedding.apk"
          done
          
          # 如果没有找到，检查输出目录
          if [ ! -f "./fongmitv_hwedding.apk" ]; then
            echo "尝试从标准路径复制..."
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmitv_hwedding.apk 2>/dev/null || true
          fi

      # 上传 - 使用简单英文名
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmitv-hwedding-build  # 只用英文和连字符
          path: ./fongmitv_hwedding.apk
          retention-days: 30
