name: Build FongMi TV with hwedding Source

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Modify App.java to add default config
        run: |
          cd TV
          cat > app/src/main/java/com/fongmi/android/tv/App.java << 'EOF'
          package com.fongmi.android.tv;

          import android.app.Application;
          import android.content.SharedPreferences;
          import android.preference.PreferenceManager;

          import com.fongmi.android.tv.utils.Notify;
          import com.fongmi.android.tv.utils.Pref;
          import com.fongmi.android.tv.utils.UrlUtil;

          public class App extends Application {
              private static App instance;

              public static App get() {
                  return instance;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  
                  try {
                      SharedPreferences sp = PreferenceManager.getDefaultSharedPreferences(this);
                      String configUrl = sp.getString("config_url", "");
                      if (configUrl == null || configUrl.isEmpty()) {
                          sp.edit().putString("config_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                      
                      String vodUrl = sp.getString("vod_url", "");
                      if (vodUrl == null || vodUrl.isEmpty()) {
                          sp.edit().putString("vod_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  
                  Notify.init(this);
                  Pref.init(this);
                  UrlUtil.init(this);
              }
          }
          EOF

      - name: Minimal changes to build.gradle
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 1. 检查并添加 plugins 块（如果不存在）
          if ! grep -q "com.chaquo.python" app/build.gradle; then
            if grep -q "plugins {" app/build.gradle; then
              # 在已有的 plugins 块中添加 chaquopy
              sed -i '/plugins {/a \    id "com.chaquo.python"' app/build.gradle
            else
              # 在文件开头添加 plugins 块
              sed -i '1i plugins {\n    id "com.android.application"\n    id "com.chaquo.python"\n}\n' app/build.gradle
            fi
          fi
          
          # 2. 检查并添加 namespace（如果不存在）
          if ! grep -q "namespace" app/build.gradle; then
            sed -i '/android {/a \    namespace "com.fongmi.android.tv"' app/build.gradle
          fi
          
          # 3. 检查并修改 minSdk（如果小于24）
          if grep -q "minSdk [0-9]" app/build.gradle; then
            sed -i 's/minSdk [0-9]\+/minSdk 24/g' app/build.gradle
          else
            # 如果不存在 minSdk，在 defaultConfig 中添加
            sed -i '/defaultConfig {/a \        minSdk 24' app/build.gradle
          fi
          
          # 4. 检查并添加 ndk.abiFilters（如果不存在）
          if ! grep -q "abiFilters" app/build.gradle; then
            sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\n        }' app/build.gradle
          fi
          
          # 5. 检查并添加 chaquopy 配置（如果不存在）
          if ! grep -q "chaquopy" app/build.gradle; then
            cat >> app/build.gradle << 'EOF'

          chaquopy {
              version "3.10"
          }
          EOF
          fi
          
          echo ">>> 修改后的 build.gradle 关键部分:"
          grep -E "plugins|namespace|minSdk|abiFilters|chaquopy" app/build.gradle
          
          echo ">>> 保留的原始配置:"
          head -20 app/build.gradle

      - name: Create local.properties
        run: |
          cd TV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.executable=/usr/bin/python3.10" >> local.properties

      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-final
          path: TV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
