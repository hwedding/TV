name: Build FongMi TV with hwedding Source

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Modify App.java to add default config
        run: |
          cd TV
          cat > app/src/main/java/com/fongmi/android/tv/App.java << 'EOF'
          package com.fongmi.android.tv;

          import android.app.Application;
          import android.content.SharedPreferences;
          import android.preference.PreferenceManager;

          import com.fongmi.android.tv.utils.Notify;
          import com.fongmi.android.tv.utils.Pref;
          import com.fongmi.android.tv.utils.UrlUtil;

          public class App extends Application {
              private static App instance;

              public static App get() {
                  return instance;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  
                  try {
                      SharedPreferences sp = PreferenceManager.getDefaultSharedPreferences(this);
                      String configUrl = sp.getString("config_url", "");
                      if (configUrl == null || configUrl.isEmpty()) {
                          sp.edit().putString("config_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                      
                      String vodUrl = sp.getString("vod_url", "");
                      if (vodUrl == null || vodUrl.isEmpty()) {
                          sp.edit().putString("vod_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  
                  Notify.init(this);
                  Pref.init(this);
                  UrlUtil.init(this);
              }
          }
          EOF

      - name: Configure build.gradle with correct chaquopy syntax
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 创建新的build.gradle内容，使用正确的 version 语法
          cat > app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "com.chaquo.python"
          }

          android {
              compileSdk 33

              defaultConfig {
                  applicationId "com.fongmi.android.tv"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }

          // 正确的 chaquopy 配置 - 使用 version 属性
          chaquopy {
              version "3.10"
          }
          EOF
          
          echo ">>> 修正后的 build.gradle 内容:"
          cat app/build.gradle

      - name: Check root config for plugin version
        run: |
          cd TV
          echo "=== 根目录 build.gradle ==="
          if [ -f build.gradle ]; then
            cat build.gradle
          else
            echo "不存在"
          fi
          
          echo "=== 根目录 settings.gradle ==="
          if [ -f settings.gradle ]; then
            cat settings.gradle
          else
            echo "不存在"
          fi
          
          echo "=== gradle.properties ==="
          if [ -f gradle.properties ]; then
            cat gradle.properties
          else
            echo "不存在"
          fi

      - name: Create local.properties
        run: |
          cd TV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.executable=/usr/bin/python3.10" >> local.properties

      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      - name: Find and Upload APK
        run: |
          echo "查找编译生成的APK..."
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到: $apk"
            cp "$apk" ./fongmi_hwedding.apk
          done
          
          if [ ! -f ./fongmi_hwedding.apk ]; then
            echo "尝试从标准路径复制..."
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmi_hwedding.apk 2>/dev/null || echo "未找到APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-apk
          path: ./fongmi_hwedding.apk
          if-no-files-found: warn
          retention-days: 30
