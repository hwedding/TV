name: Build FongMi TV with hwedding Source

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Modify App.java to add default config (try all possible keys)
        run: |
          cd TV
          
          # 备份原文件
          cp app/src/main/java/com/fongmi/android/tv/App.java app/src/main/java/com/fongmi/android/tv/App.java.bak
          
          # 在 onCreate 方法中添加默认配置，尝试所有可能的 key
          sed -i '/super.onCreate/a \        \n        // 设置默认配置地址 - 尝试所有可能的 key\n        try {\n            android.content.SharedPreferences sp = android.preference.PreferenceManager.getDefaultSharedPreferences(this);\n            \n            // 可能的 key 列表\n            String[] possibleKeys = {"config_url", "vod_url", "address", "config_address", "url", "api_url", "site_url"};\n            String defaultUrl = "http://tv.hwedding.cn/zhou.json";\n            \n            for (String key : possibleKeys) {\n                String value = sp.getString(key, "");\n                if (value == null || value.isEmpty()) {\n                    sp.edit().putString(key, defaultUrl).apply();\n                }\n            }\n            \n            // 同时保存一份到默认配置\n            android.content.SharedPreferences defaultSp = android.preference.PreferenceManager.getDefaultSharedPreferences(this);\n            defaultSp.edit().putString("config_url", defaultUrl).apply();\n            \n        } catch (Exception e) {\n            e.printStackTrace();\n        }\n' app/src/main/java/com/fongmi/android/tv/App.java
          
          echo ">>> 修改后的 App.java (显示添加的代码):"
          grep -A20 -B5 "设置默认配置地址" app/src/main/java/com/fongmi/android/tv/App.java

      - name: Minimal changes to build.gradle
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 1. 检查并添加 plugins 块（如果不存在）
          if ! grep -q "com.chaquo.python" app/build.gradle; then
            if grep -q "plugins {" app/build.gradle; then
              # 在已有的 plugins 块中添加 chaquopy
              sed -i '/plugins {/a \    id "com.chaquo.python"' app/build.gradle
            else
              # 在文件开头添加 plugins 块
              sed -i '1i plugins {\n    id "com.android.application"\n    id "com.chaquo.python"\n}\n' app/build.gradle
            fi
          fi
          
          # 2. 检查并添加 namespace（如果不存在）
          if ! grep -q "namespace" app/build.gradle; then
            sed -i '/android {/a \    namespace "com.fongmi.android.tv"' app/build.gradle
          fi
          
          # 3. 检查并修改 minSdk（如果小于24）
          if grep -q "minSdk [0-9]" app/build.gradle; then
            sed -i 's/minSdk [0-9]\+/minSdk 24/g' app/build.gradle
          fi
          
          # 4. 检查并添加 ndk.abiFilters（如果不存在）
          if ! grep -q "abiFilters" app/build.gradle; then
            sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"\n        }' app/build.gradle
          fi
          
          # 5. 检查并添加 chaquopy 配置（如果不存在）
          if ! grep -q "chaquopy" app/build.gradle; then
            cat >> app/build.gradle << 'EOF'

          chaquopy {
              version "3.10"
          }
          EOF
          fi
          
          echo ">>> 修改后的 build.gradle 关键部分:"
          grep -E "plugins|namespace|minSdk|abiFilters|chaquopy" app/build.gradle

      - name: Create local.properties
        run: |
          cd TV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.executable=/usr/bin/python3.10" >> local.properties

      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-final
          path: TV/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
