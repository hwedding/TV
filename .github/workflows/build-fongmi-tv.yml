name: Build FongMi TV (精准api/config路径+内置hwedding源)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取你新Fork的TV仓库（源码和官方一致）
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 精准替换api/config/下的接口文件（手动确认的路径）
      - name: Inject Custom Config URL (api/config/)
        run: |
          # 精准路径：api/config/，替换你的源
          sed -i 's#return Config.get().getVodUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java
          sed -i 's#return Config.get().getLiveUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/config/LiveConfig.java
          # 配置Chaquopy使用Python 3.10
          sed -i '/chaquopy {/a \ \ \ \ pythonVersion "3.10"' TV/app/build.gradle

      # 安装Python 3.10（解决Chaquopy依赖）
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update -y
          sudo apt install -y python3.10 python3.10-dev
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python
          python --version

      # 配置JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 编译APK（清理缓存，确保纯净编译）
      - name: Build Release APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean  # 清理旧编译缓存
          ./gradlew assembleRelease --info
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10
          GRADLE_OPTS: "-Dmaven.aliyun.com/nexus/content/groups/public/"

      # 上传APK（适配官方源码的输出路径）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-内置hwedding源（精准路径版）
          path: TV/app/build/outputs/apk/release/*.apk
          retention-days: 30
