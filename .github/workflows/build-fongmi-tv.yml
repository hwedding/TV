name: Detailed Debug - Find Config Location

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 第一步：显示关键文件内容（修改前）
      - name: Show original file content
        run: |
          cd TV
          echo "=== 修改前的 Config.java ==="
          cat app/src/main/java/com/fongmi/android/tv/bean/Config.java | head -50
          
          echo -e "\n=== 修改前的 Parse.java ==="
          cat app/src/main/java/com/fongmi/android/tv/bean/Parse.java | head -20
          
          echo -e "\n=== 修改前的 App.java ==="
          cat app/src/main/java/com/fongmi/android/tv/App.java | head -50

      # 第二步：安装Python 3.10
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第三步：尝试精准修改（只改最可能的地方）
      - name: Precise injection
        run: |
          cd TV
          
          # 方法1: 修改Config.java中的getUrl方法
          echo "修改 Config.java 中的 getUrl 方法"
          sed -i 's/public String getUrl() {[^}]*}/public String getUrl() { return "http:\/\/tv.hwedding.cn\/zhou.json"; }/g' app/src/main/java/com/fongmi/android/tv/bean/Config.java
          
          # 方法2: 在App.java的onCreate中写入SharedPreferences
          echo "修改 App.java"
          # 在onCreate方法的第一行添加
          sed -i '/public void onCreate() {/a \        \/\/ 设置默认配置地址\n        android.content.SharedPreferences sp = getSharedPreferences("config", MODE_PRIVATE);\n        if (!sp.getString("vod_url", "").isEmpty()) {\n            sp.edit().putString("vod_url", "http:\/\/tv.hwedding.cn\/zhou.json").apply();\n        }' app/src/main/java/com/fongmi/android/tv/App.java
          
          # 显示修改后的内容
          echo -e "\n=== 修改后的 App.java ==="
          cat app/src/main/java/com/fongmi/android/tv/App.java | grep -A10 -B5 "onCreate"

      # 第四步：编译
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      # 第五步：上传APK
      - name: Upload APK
        run: |
          find TV -name "*.apk" -type f -exec cp {} ./fongmitv.apk \;
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmitv-precise-build
          path: ./fongmitv.apk
          retention-days: 30
