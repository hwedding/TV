name: Build FongMi TV (全新Fork不改名+内置hwedding源)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取你新Fork的、不改名的TV仓库（源码和官方一致）
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV  # 新Fork的仓库名是TV，不是gewuTV
          ref: release
          path: TV

      # 安装Python 3.10（解决Chaquopy依赖）
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update -y
          sudo apt install -y python3.10 python3.10-dev
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python
          python --version

      # 内置你的源 http://tv.hwedding.cn（官方路径，无config子目录）
      - name: Inject Your Custom URL
        run: |
          sed -i 's#return Config.get().getVodUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/VodConfig.java
          sed -i 's#return Config.get().getLiveUrl();#return "http://tv.hwedding.cn";#g' TV/app/src/main/java/com/fongmi/android/tv/api/LiveConfig.java
          sed -i '/chaquopy {/a \ \ \ \ pythonVersion "3.10"' TV/app/build.gradle

      # 配置JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 编译APK（源码无损坏，必成功）
      - name: Build Release APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew assembleRelease --info
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10
          GRADLE_OPTS: "-Dmaven.aliyun.com/nexus/content/groups/public/"

      # 上传APK（确保能下载）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-新Fork版+hwedding源
          path: TV/app/build/outputs/apk/release/*.apk
          retention-days: 30
