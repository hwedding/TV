name: Final Fix - FongMi TV with hwedding Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 第一步：安装Python 3.10
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第二步：修改源码 - 只改App.java，不改VodConfig.java
      - name: Fix App.java only
        run: |
          cd TV
          
          # 备份原文件
          cp app/src/main/java/com/fongmi/android/tv/App.java app/src/main/java/com/fongmi/android/tv/App.java.bak
          
          echo "=== 修改 App.java 添加默认配置 ==="
          
          # 直接写入修改后的内容
          cat > app/src/main/java/com/fongmi/android/tv/App.java << 'EOF'
          package com.fongmi.android.tv;

          import android.app.Application;
          import android.content.SharedPreferences;
          import android.preference.PreferenceManager;

          import com.fongmi.android.tv.utils.Notify;
          import com.fongmi.android.tv.utils.Pref;
          import com.fongmi.android.tv.utils.UrlUtil;

          public class App extends Application {

              private static App instance;

              public static App get() {
                  return instance;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  
                  // 设置默认配置地址
                  try {
                      SharedPreferences sp = PreferenceManager.getDefaultSharedPreferences(this);
                      String configUrl = sp.getString("config_url", "");
                      if (configUrl == null || configUrl.isEmpty()) {
                          sp.edit().putString("config_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                      
                      String vodUrl = sp.getString("vod_url", "");
                      if (vodUrl == null || vodUrl.isEmpty()) {
                          sp.edit().putString("vod_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  
                  // 原有的其他初始化代码
                  Notify.init(this);
                  Pref.init(this);
                  UrlUtil.init(this);
              }
          }
          EOF
          
          echo "=== App.java 修改完成 ==="
          head -30 app/src/main/java/com/fongmi/android/tv/App.java

      # 第三步：修改build.gradle配置Python 3.10
      - name: Configure gradle
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 添加Python版本配置
          if grep -q "chaquopy" app/build.gradle; then
            # 如果已存在，修改版本号
            sed -i 's/pythonVersion ".*"/pythonVersion "3.10"/g' app/build.gradle
          else
            # 如果不存在，在android块前添加
            sed -i '/android {/i chaquopy {\n    pythonVersion "3.10"\n}\n' app/build.gradle
          fi
          
          echo "build.gradle修改完成"
          grep -A2 -B2 "chaquopy" app/build.gradle || echo "chaquopy配置未找到"

      # 第四步：创建local.properties
      - name: Create local.properties
        run: |
          cd TV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.executable=/usr/bin/python3.10" >> local.properties

      # 第五步：编译APK
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 第六步：查找APK
      - name: Find APK
        run: |
          echo "查找编译生成的APK..."
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到: $apk"
            ls -la "$apk"
            cp "$apk" ./fongmi_hwedding_final.apk
          done
          
          # 如果没找到，尝试所有可能的输出路径
          if [ ! -f ./fongmi_hwedding_final.apk ]; then
            echo "尝试从标准路径复制..."
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmi_hwedding_final.apk 2>/dev/null || \
            cp TV/app/build/outputs/apk/*/debug/*.apk ./fongmi_hwedding_final.apk 2>/dev/null || \
            cp TV/app/build/outputs/apk/*.apk ./fongmi_hwedding_final.apk 2>/dev/null || \
            echo "未找到APK"
          fi
          
          # 列出所有可能的输出目录
          echo "=== 检查输出目录 ==="
          ls -la TV/app/build/outputs/apk/ || true
          ls -la TV/app/build/outputs/apk/debug/ || true
          ls -la TV/app/build/outputs/apk/leanback/debug/ || true

      # 第七步：上传APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-final
          path: ./fongmi_hwedding_final.apk
          if-no-files-found: warn
          retention-days: 30
