name: Build FongMi TV with hwedding Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 第一步：安装Python 3.10
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第二步：修改 App.java 添加默认配置地址
      - name: Modify App.java to add default config
        run: |
          cd TV
          
          # 备份原文件
          cp app/src/main/java/com/fongmi/android/tv/App.java app/src/main/java/com/fongmi/android/tv/App.java.bak
          
          # 写入修改后的内容
          cat > app/src/main/java/com/fongmi/android/tv/App.java << 'EOF'
          package com.fongmi.android.tv;

          import android.app.Application;
          import android.content.SharedPreferences;
          import android.preference.PreferenceManager;

          import com.fongmi.android.tv.utils.Notify;
          import com.fongmi.android.tv.utils.Pref;
          import com.fongmi.android.tv.utils.UrlUtil;

          public class App extends Application {

              private static App instance;

              public static App get() {
                  return instance;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  
                  // 设置默认配置地址
                  try {
                      SharedPreferences sp = PreferenceManager.getDefaultSharedPreferences(this);
                      String configUrl = sp.getString("config_url", "");
                      if (configUrl == null || configUrl.isEmpty()) {
                          sp.edit().putString("config_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                      
                      String vodUrl = sp.getString("vod_url", "");
                      if (vodUrl == null || vodUrl.isEmpty()) {
                          sp.edit().putString("vod_url", "http://tv.hwedding.cn/zhou.json").apply();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  
                  // 原有的其他初始化代码
                  Notify.init(this);
                  Pref.init(this);
                  UrlUtil.init(this);
              }
          }
          EOF

      # 第三步：最终修复 - 正确配置 build.gradle
      - name: Final fix for build.gradle
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 1. 在文件顶部添加 apply plugin (如果不存在)
          if ! grep -q "apply plugin: 'com.chaquo.python'" app/build.gradle; then
            # 在文件开头插入 apply plugin 语句
            sed -i '1i apply plugin: "com.chaquo.python"\n' app/build.gradle
          fi
          
          # 2. 移除可能导致问题的 plugins 块 (如果存在且不是必需的)
          #    很多老旧项目不使用 plugins {} 块，而是用 apply plugin
          sed -i '/plugins {/,/}/d' app/build.gradle
          
          # 3. 确保 compileSdk 存在 (如果不存在则添加)
          if ! grep -q "compileSdk" app/build.gradle; then
            sed -i '/android {/a \    compileSdk 33' app/build.gradle
          fi
          
          # 4. 确保 defaultConfig 存在基础配置 (如果不存在)
          if ! grep -q "defaultConfig" app/build.gradle; then
            # 使用精确的 sed 命令插入 defaultConfig 块
            sed -i '/compileSdk 33/a \\n    defaultConfig {\n        applicationId "com.fongmi.android.tv"\n        minSdk 21\n        targetSdk 33\n        versionCode 1\n        versionName "1.0"\n    }' app/build.gradle
          fi
          
          # 5. 确保 chaquopy 块正确配置 (如果不存在或需要修正)
          #    先删除可能存在的错误 chaquopy 块，然后重新添加正确的
          sed -i '/chaquopy {/,/}/d' app/build.gradle
          # 在文件末尾添加正确的 chaquopy 配置
          cat >> app/build.gradle << 'EOF'

          chaquopy {
              pythonVersion "3.10"
          }
          EOF
          
          echo ">>> 最终修改后的 app/build.gradle 关键内容:"
          grep -E "apply plugin|compileSdk|defaultConfig|chaquopy|pythonVersion" app/build.gradle
          
          echo ">>> 显示文件末尾20行以确认:"
          tail -20 app/build.gradle

      # 第四步：检查项目根目录的 build.gradle 是否有插件管理
      - name: Check root build.gradle
        run: |
          cd TV
          echo "=== 根目录 build.gradle ==="
          cat build.gradle || echo "没有根build.gradle"
          
          echo "=== 根目录 settings.gradle ==="
          cat settings.gradle || echo "没有settings.gradle"

      # 第五步：创建 local.properties
      - name: Create local.properties
        run: |
          cd TV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "python.executable=/usr/bin/python3.10" >> local.properties

      # 第六步：编译 APK
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10
          ANDROID_HOME: /usr/local/lib/android/sdk

      # 第七步：查找 APK
      - name: Find APK
        run: |
          echo "查找编译生成的APK..."
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到: $apk"
            ls -la "$apk"
            cp "$apk" ./fongmi_hwedding.apk
          done
          
          # 如果没找到，尝试所有可能的输出路径
          if [ ! -f ./fongmi_hwedding.apk ]; then
            echo "尝试从标准路径复制..."
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmi_hwedding.apk 2>/dev/null || \
            cp TV/app/build/outputs/apk/*/debug/*.apk ./fongmi_hwedding.apk 2>/dev/null || \
            cp TV/app/build/outputs/apk/*.apk ./fongmi_hwedding.apk 2>/dev/null || \
            echo "未找到APK"
          fi
          
          # 列出所有可能的输出目录
          echo "=== 检查输出目录 ==="
          ls -la TV/app/build/outputs/apk/ || true
          ls -la TV/app/build/outputs/apk/debug/ || true

      # 第八步：上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-final
          path: ./fongmi_hwedding.apk
          if-no-files-found: warn
          retention-days: 30
