name: Fix - FongMi TV with hwedding Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 第一步：安装Python 3.10（使用deadsnakes PPA，避免pip问题）
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-distutils
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10
          python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第二步：修改源码 - 修复语法错误并添加默认配置
      - name: Fix App.java and inject config
        run: |
          cd TV
          
          # 备份原文件
          cp app/src/main/java/com/fongmi/android/tv/App.java app/src/main/java/com/fongmi/android/tv/App.java.bak
          
          echo "=== 修改 App.java 添加默认配置（修复语法错误）==="
          
          # 使用cat命令直接写入修改后的内容（最可靠的方式）
          cat > app/src/main/java/com/fongmi/android/tv/App.java << 'EOF'
          package com.fongmi.android.tv;

          import android.app.Application;
          import android.content.SharedPreferences;
          import android.preference.PreferenceManager;

          import com.fongmi.android.tv.utils.Notify;
          import com.fongmi.android.tv.utils.Pref;

          public class App extends Application {

              private static App instance;

              public static App get() {
                  return instance;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  
                  // 设置默认配置地址
                  SharedPreferences sp = PreferenceManager.getDefaultSharedPreferences(this);
                  String configUrl = sp.getString("config_url", "");
                  if (configUrl.isEmpty()) {
                      sp.edit().putString("config_url", "http://tv.hwedding.cn/zhou.json").apply();
                  }
                  
                  String vodUrl = sp.getString("vod_url", "");
                  if (vodUrl.isEmpty()) {
                      sp.edit().putString("vod_url", "http://tv.hwedding.cn/zhou.json").apply();
                  }
                  
                  // 原有的其他初始化代码
                  Notify.init(this);
                  Pref.init(this);
              }
          }
          EOF
          
          echo "=== 修改完成，显示修改后的App.java内容 ==="
          cat app/src/main/java/com/fongmi/android/tv/App.java
          
          # 同时修改VodConfig.java（备用方案）
          echo "=== 修改 VodConfig.java ==="
          if [ -f app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java ]; then
            cp app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java.bak
            sed -i 's#return Config.get().getVodUrl();#return "http://tv.hwedding.cn/zhou.json";#g' app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java
            echo "VodConfig.java修改后的内容："
            grep -n "getVodUrl" app/src/main/java/com/fongmi/android/tv/api/config/VodConfig.java
          fi

      # 第三步：修改build.gradle配置Python 3.10
      - name: Configure gradle for Python 3.10
        run: |
          cd TV
          
          # 备份原文件
          cp app/build.gradle app/build.gradle.bak
          
          # 添加Python版本配置
          if grep -q "chaquopy" app/build.gradle; then
            sed -i '/chaquopy {/a \        pythonVersion "3.10"' app/build.gradle
          else
            echo "未找到chaquopy配置，手动添加"
            sed -i '/android {/i chaquopy {\n    pythonVersion "3.10"\n}\n' app/build.gradle
          fi
          
          echo "build.gradle修改完成"

      # 第四步：编译APK
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      # 第五步：查找并上传APK
      - name: Upload APK
        run: |
          echo "查找编译生成的APK..."
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到: $apk"
            cp "$apk" ./fongmi_hwedding.apk
          done
          
          # 如果没找到，尝试标准路径
          if [ ! -f ./fongmi_hwedding.apk ]; then
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmi_hwedding.apk 2>/dev/null || echo "未找到APK"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-hwedding-fixed
          path: ./fongmi_hwedding.apk
          retention-days: 30
