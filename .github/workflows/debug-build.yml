name: Debug - Find Config Location

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Forked TV Repo
        uses: actions/checkout@v4
        with:
          repository: hwedding/TV
          ref: release
          path: TV

      # 第一步：详细的调试信息 - 查找所有相关文件
      - name: Debug - Find all config related files
        run: |
          cd TV
          echo "========================================="
          echo "1. 查找 ConfigLoader.java"
          echo "========================================="
          find . -name "ConfigLoader.java" -type f | while read file; do
            echo "找到: $file"
            echo "--- 文件内容 ---"
            cat "$file"
            echo "----------------"
          done
          
          echo -e "\n\n========================================="
          echo "2. 查找包含 'config_url' 的文件"
          echo "========================================="
          grep -r "config_url" --include="*.java" . | while read line; do
            echo "$line"
          done
          
          echo -e "\n\n========================================="
          echo "3. 查找包含 'vod_url' 的文件"
          echo "========================================="
          grep -r "vod_url" --include="*.java" . | while read line; do
            echo "$line"
          done
          
          echo -e "\n\n========================================="
          echo "4. 查找 getConfigUrl 方法"
          echo "========================================="
          grep -r "getConfigUrl" --include="*.java" . | while read line; do
            echo "$line"
          done
          
          echo -e "\n\n========================================="
          echo "5. 查找 SettingActivity.java"
          echo "========================================="
          find . -name "SettingActivity.java" -type f | while read file; do
            echo "找到: $file"
            echo "--- 文件内容 (包含 et_config 的部分) ---"
            grep -n "et_config" "$file" || echo "未找到 et_config"
            echo "--- 文件内容 (包含 配置地址 的部分) ---"
            grep -n "配置地址" "$file" || echo "未找到 配置地址"
          done
          
          echo -e "\n\n========================================="
          echo "6. 查找 App.java"
          echo "========================================="
          find . -name "App.java" -type f | while read file; do
            echo "找到: $file"
            echo "--- 文件内容 (包含 onCreate 的部分) ---"
            sed -n '/onCreate/,/}/p' "$file"
          done
          
          echo -e "\n\n========================================="
          echo "7. 查找所有包含 SharedPreferences 的读取操作"
          echo "========================================="
          grep -r "getString.*config" --include="*.java" . | head -20
          
          echo -e "\n\n========================================="
          echo "8. 查找所有包含 SharedPreferences 的写入操作"
          echo "========================================="
          grep -r "putString.*config" --include="*.java" . | head -20
          
          echo -e "\n\n========================================="
          echo "9. 查找所有包含 'et_dianbo' 的文件"
          echo "========================================="
          grep -r "et_dianbo" --include="*.java" --include="*.xml" . | head -20
          
          echo -e "\n\n========================================="
          echo "10. 输出 strings.xml 的内容"
          echo "========================================="
          find . -name "strings.xml" -type f | while read file; do
            echo "文件: $file"
            grep -n "config\|配置\|地址" "$file" | head -10
          done

      # 第二步：安装Python 3.10
      - name: Install Python 3.10
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev

      # 第三步：设置JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 第四步：根据调试结果进行修改（这次我们尝试多种可能性）
      - name: Try multiple injection methods based on debug info
        run: |
          cd TV
          
          echo "========================================="
          echo "开始修改源码 - 尝试多种方法"
          echo "========================================="
          
          # 方法1: 修改 SharedPreferences 的默认值（在第一次读取时）
          echo "方法1: 修改 SharedPreferencesHelper.java"
          find . -name "SharedPreferencesHelper.java" -o -name "PrefManager.java" -o -name "Preferences.java" | while read file; do
            echo "修改文件: $file"
            cp "$file" "$file.bak"
            # 在getString方法中添加默认值
            sed -i 's/getString([^,)]*,[[:space:]]*""[[:space:]]*)/getString("config_url", "http:\/\/tv.hwedding.cn\/zhou.json")/g' "$file"
          done
          
          # 方法2: 修改 Config.java 中的 getUrl 方法
          echo "方法2: 修改 Config.java"
          find . -name "Config.java" | while read file; do
            echo "修改文件: $file"
            cp "$file" "$file.bak"
            # 直接修改 getUrl 方法返回你的地址
            perl -i -pe 's/public String getUrl\(\) \{.*?\}/public String getUrl() { return "http:\/\/tv.hwedding.cn\/zhou.json"; }/s' "$file"
          done
          
          # 方法3: 修改 App.java 在启动时预置
          echo "方法3: 修改 App.java"
          find . -name "App.java" | while read file; do
            echo "修改文件: $file"
            cp "$file" "$file.bak"
            # 在onCreate开头添加预置代码
            sed -i '/super.onCreate(/a \n        // 设置默认配置地址\n        android.content.SharedPreferences sp = getSharedPreferences("config", MODE_PRIVATE);\n        if (!sp.contains("vod_url") \&\& !sp.contains("config_url")) {\n            sp.edit().putString("vod_url", "http:\/\/tv.hwedding.cn\/zhou.json").putString("config_url", "http:\/\/tv.hwedding.cn\/zhou.json").apply();\n        }\n' "$file"
          done
          
          # 方法4: 修改 ApiConfig.java（如果存在）
          echo "方法4: 修改 ApiConfig.java"
          find . -name "ApiConfig.java" | while read file; do
            echo "修改文件: $file"
            cp "$file" "$file.bak"
            sed -i 's/getUrl()/return "http:\/\/tv.hwedding.cn\/zhou.json";/g' "$file"
          done
          
          # 方法5: 修改 VodConfig.java
          echo "方法5: 修改 VodConfig.java"
          find . -name "VodConfig.java" | while read file; do
            echo "修改文件: $file"
            cp "$file" "$file.bak"
            sed -i 's#return Config.get().getVodUrl();#return "http://tv.hwedding.cn";#g' "$file"
          done
          
          echo "========================================="
          echo "修改完成，开始编译"
          echo "========================================="

      # 第五步：编译APK
      - name: Build APK
        run: |
          cd TV
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
        env:
          PYTHON_EXECUTABLE: /usr/bin/python3.10

      # 第六步：查找并上传APK
      - name: Find and upload APK
        run: |
          echo "查找编译生成的APK..."
          find TV -name "*.apk" -type f | while read apk; do
            echo "找到: $apk"
            cp "$apk" ./fongmitv-debug.apk
          done
          
          # 如果没有找到，检查标准路径
          if [ ! -f ./fongmitv-debug.apk ]; then
            echo "尝试从标准路径复制..."
            cp TV/app/build/outputs/apk/debug/*.apk ./fongmitv-debug.apk 2>/dev/null || echo "未找到APK"
          fi

      # 第七步：上传所有调试信息
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmitv-debug-complete
          path: |
            ./fongmitv-debug.apk
            TV/app/src/main/java/com/fongmi/android/tv/**/*.java
          retention-days: 30
